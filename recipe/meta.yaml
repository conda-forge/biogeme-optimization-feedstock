{% set name = "biogeme-optimization" %}
{% set version = "0.0.14" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/biogeme_optimization-{{ version }}.tar.gz
  sha256: 9be0b1e2de0bf52b45bc05bdbb2d6bbc14849a4217724db2c902dc6f22561c81
  patches:
    - pyproject.toml.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.7
    - setuptools >=63.4.1
    - pip
  run:
    - python >=3.7
    - numpy
    - scipy >=1.15.2
    - matplotlib-base >=3.8.4
    - tomlkit >=0.12.5

test:
  imports:
    - biogeme_optimization
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://biogeme.epfl.ch
  summary: Various optimization algorithms for teaching and research
  license: LicenseRef-BIOGEME-OPTIMIZATION
  license_file: LICENSE
  dev_url: https://github.com/michelbierlaire/optimization

extra:
  recipe-maintainers:
    - FGarridoV
    - sandervancranenburgh
